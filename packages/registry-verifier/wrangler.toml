name = "registry-verifier"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "registry_db"
database_id = "eab7860d-51a4-4eb0-abee-d89c14e8c233"

[[queues.consumers]]
queue = "openkarta-verify"
max_batch_size = 10
max_batch_timeout = 30

# Secrets (set via `wrangler secret put`):
#   RESEND_API_KEY
#   BADGE_SIGNING_SECRET
