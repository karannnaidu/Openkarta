name = "registry-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.openkarta.org", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "registry_db"
database_id = "eab7860d-51a4-4eb0-abee-d89c14e8c233"
migrations_dir = "migrations"

[[queues.producers]]
binding = "VERIFY_QUEUE"
queue = "openkarta-verify"

[vars]
PUBLIC_BASE_URL = "https://api.openkarta.org"
WEB_BASE_URL    = "https://registry.openkarta.org"

# Secrets (set via `wrangler secret put`):
#   RESEND_API_KEY
#   GITHUB_OAUTH_CLIENT_ID
#   GITHUB_OAUTH_CLIENT_SECRET
#   SESSION_SECRET
