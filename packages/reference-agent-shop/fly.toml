# fly.toml app configuration file generated for halcyon-shop-thrumming-bush-622 on 2026-04-26T02:41:29+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'halcyon-shop-thrumming-bush-622'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '4001'
  PUBLIC_BASE_URL = 'https://halcyon-shop.fly.dev'

[http_service]
  internal_port = 4001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/v0/discover'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
