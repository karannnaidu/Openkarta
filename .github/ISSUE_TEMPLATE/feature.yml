name: Feature request
description: Propose an enhancement to the protocol, SDK, reference agents, or conformance harness.
labels: [enhancement]
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: One-line summary of the proposed feature.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who feels it?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Sketch the API, schema change, or behaviour you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What did you reject, and why?
    validations:
      required: false
